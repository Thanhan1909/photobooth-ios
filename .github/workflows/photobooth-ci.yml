name: Photobooth CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare writable persistent directories
        run: |
          mkdir -p data private config
          sudo chown -R 1000:1000 data private config
      - name: Build image
        run: docker compose build
      - name: Start photobooth
        run: docker compose up -d --no-build
      - name: Verify HTTP
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8085/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify mobile camera assets
        run: |
          docker compose exec -T photobooth node --check /app/mobile/filter-engine.js
          docker compose exec -T photobooth node --check /app/mobile/camera.js
          docker compose exec -T photobooth node /app/tests/mobile-filter-engine.test.cjs
          curl --fail --silent --show-error http://localhost:8085/mobile/ | grep -q 'Photobooth Camera'
          curl --fail --silent --show-error http://localhost:8085/mobile/filter-engine.js | grep -q 'PhotoboothFilters'
          curl --fail --silent --show-error http://localhost:8085/mobile/camera.js | grep -q 'getUserMedia'
      - name: Stop
        if: always()
        run: docker compose down
