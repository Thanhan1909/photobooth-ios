name: Photobooth CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: photobooth-windows-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Prepare writable persistent directories
        run: |
          mkdir -p data private config
          sudo chown -R 1000:1000 data private config
      - name: Build image
        run: docker compose build
      - name: Start photobooth
        run: docker compose up -d --no-build
      - name: Verify HTTP
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8085/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify mobile camera assets
        run: |
          docker compose exec -T photobooth node --check /app/mobile/filter-engine.js
          docker compose exec -T photobooth node --check /app/mobile/studio.js
          docker compose exec -T photobooth node /app/tests/mobile-filter-engine.test.cjs
          docker compose exec -T photobooth node /app/tests/mobile-studio.test.cjs
          curl --fail --silent --show-error http://localhost:8085/mobile/ | grep -q 'Bloom Booth'
          curl --fail --silent --show-error http://localhost:8085/mobile/filter-engine.js | grep -q 'PhotoboothFilters'
          curl --fail --silent --show-error http://localhost:8085/mobile/studio.js | grep -q 'requestSegmentation'
          curl --fail --silent --show-error http://localhost:8085/mobile/studio.css | grep -q 'studio'
          curl --fail --silent --show-error http://localhost:8085/mobile/vendor/mediapipe/selfie_segmentation.js | grep -q 'SelfieSegmentation'
          curl --fail --silent --output /dev/null http://localhost:8085/mobile/vendor/mediapipe/selfie_segmentation_solution_wasm_bin.wasm
      - name: Publish approved commit for Windows deployment
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git push origin HEAD:refs/heads/deploy/windows
      - name: Stop
        if: always()
        run: docker compose down
