name: Photobooth CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: photobooth-windows-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Prepare writable persistent directories
        run: |
          mkdir -p data private config
          sudo chown -R 1000:1000 data private config
      - name: Build image
        run: docker compose build
      - name: Start photobooth
        run: docker compose up -d --no-build
      - name: Verify HTTP
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8085/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify mobile camera assets
        run: |
          docker compose exec -T photobooth node --check /app/mobile/filter-engine.js
          docker compose exec -T photobooth node --check /app/mobile/lite.js
          docker compose exec -T photobooth node --check /app/mobile/frame-engine.js
          docker compose exec -T photobooth node --check /app/mobile/frame-art.js
          docker compose exec -T photobooth node --check /app/mobile/selection-engine.js
          docker compose exec -T photobooth node --check /app/mobile/studio-engine.js
          docker compose exec -T photobooth node /app/tests/mobile-filter-engine.test.cjs
          docker compose exec -T photobooth node /app/tests/mobile-studio-v2.test.cjs
          docker compose exec -T photobooth node /app/tests/frame-layout-regression.test.cjs
          docker compose exec -T photobooth node /app/tests/selection-engine.test.cjs
          docker compose exec -T photobooth node /app/tests/editor-layouts.test.cjs
          docker compose exec -T photobooth node /app/tests/editor-camera-frame.test.cjs
          docker compose exec -T photobooth node /app/tests/curated-frames.test.cjs
          docker compose exec -T photobooth node /app/tests/personal-frame-defs.test.cjs
          docker compose exec -T photobooth php -l /app/index.php
          curl --fail --silent --show-error http://localhost:8085/mobile/ | grep -q 'BloomBooth'
          curl --fail --silent --show-error http://localhost:8085/mobile/filter-engine.js | grep -q 'PhotoboothFilters'
          curl --fail --silent --show-error http://localhost:8085/mobile/lite.js | grep -q 'getUserMedia'
          curl --fail --silent --show-error http://localhost:8085/mobile/frame-engine.js | grep -q 'BloomFrames'
          curl --fail --silent --show-error http://localhost:8085/mobile/frame-art.js | grep -q 'BloomFrameArt'
          curl --fail --silent --show-error http://localhost:8085/mobile/studio-engine.js | grep -q 'BloomStudio'
          curl --fail --silent --show-error http://localhost:8085/mobile/lite.css | grep -q 'mode-options'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8085/)" = 302
      - name: Publish approved commit for Windows deployment
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git push origin HEAD:refs/heads/deploy/windows
      - name: Stop
        if: always()
        run: docker compose down
